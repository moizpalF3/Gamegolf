[pytest]
testpaths = tests
markers =
    smoke: quick core checks, run on every build
    regression: the full suite - every test case
    login: login test cases
    signup: sign up test cases
    play_golf: Play Golf Live scenarios (real phone + Medallion)
    live_hardware: requires a physically connected/powered Medallion and BLE tags in range
    android: runs only on Android (skipped when --platform ios)
    ios: runs only on iOS (skipped when --platform android)
